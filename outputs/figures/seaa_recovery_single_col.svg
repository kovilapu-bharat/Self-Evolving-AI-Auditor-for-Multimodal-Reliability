<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 554" width="640" height="554">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a6d"/>
    </marker>
    <style>
      .panel { fill: #fafbfd; stroke: #cbd5e1; stroke-width: 1.2; rx: 6; ry: 6; }
      .badge { fill: #e8eef7; stroke: #2b4c7e; stroke-width: 1.2; rx: 4; ry: 4; }
      .badge-txt { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #1e3a6d; }
      .box { fill: #f1f4f8; stroke: #3b4c6b; stroke-width: 1.5; rx: 4; ry: 4; }
      .box-hl { fill: #eaf1fb; stroke: #2b4c7e; stroke-width: 1.5; rx: 4; ry: 4; }
      .strip { fill: #f8fafc; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4 3; rx: 4; ry: 4; }
      .t { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; text-anchor: middle; }
      .s { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 400; fill: #334155; text-anchor: middle; }
      .lbl { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 600; fill: #1e3a6d; }
      .solid { fill: none; stroke: #1e3a6d; stroke-width: 1.6; marker-end: url(#arr); }
      .dash { fill: none; stroke: #1e3a6d; stroke-width: 1.6; stroke-dasharray: 6 4; marker-end: url(#arr); }
      .sep { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="640" height="554" fill="#ffffff"/>

  <!-- TOP PANEL: OFFLINE VALIDATION -->
  <rect class="panel" x="14" y="12" width="612" height="314"/>
  <rect class="badge" x="26" y="24" width="248" height="28"/>
  <text class="badge-txt" x="150" y="43" text-anchor="middle">Offline Validation (Policy Learning)</text>

  <!-- Row 1 -->
  <rect class="box" x="26" y="70" width="166" height="72"/>
  <text class="t" x="109" y="99">Input Signals</text>
  <text class="s" x="109" y="119">Diagnosis, Context,</text>
  <text class="s" x="109" y="134">p<tspan baseline-shift="super" font-size="9">T</tspan>, p<tspan baseline-shift="super" font-size="9">V</tspan></text>

  <path class="solid" d="M 192 106 L 234 106"/>

  <rect class="box-hl" x="236" y="70" width="172" height="72"/>
  <text class="t" x="322" y="99">Recovery Policy</text>
  <text class="s" x="322" y="120">Select Strategy</text>
  <text class="s" x="322" y="135">(Explore + Masking)</text>

  <path class="solid" d="M 408 106 L 446 106"/>

  <rect class="box" x="448" y="70" width="166" height="72"/>
  <text class="t" x="531" y="99">Recovery &amp; Pred.</text>
  <text class="s" x="531" y="120">Apply Action +</text>
  <text class="s" x="531" y="135">Val. Thresholds</text>

  <!-- Row 2: Reward & Policy Update -->
  <rect class="box-hl" x="254" y="196" width="340" height="62"/>
  <text class="t" x="424" y="222">Reward &amp; Policy Update</text>
  <text class="s" x="424" y="243">F1 Gain vs. Static Baseline &#8594; Update Policy</text>

  <!-- Down arrow: Recovery & Pred -> Reward & Policy Update -->
  <path class="solid" d="M 531 142 L 531 194"/>

  <!-- Dashed Feedback arrow: Reward & Policy Update -> Recovery Policy -->
  <path class="dash" d="M 322 196 L 322 144"/>
  <text class="lbl" x="312" y="175" text-anchor="end">Offline Update</text>

  <!-- Shared 5-Action Strip -->
  <rect class="strip" x="26" y="274" width="588" height="38"/>
  <text class="s" x="320" y="297" style="font-weight:600; fill:#1e293b;">
    5 Admissible Actions: Text-only  |  Image-only  |  Static  |  Conservative  |  Dynamic Weighted
  </text>

  <!-- Divider -->
  <line class="sep" x1="14" y1="346" x2="626" y2="346"/>

  <!-- BOTTOM PANEL: TEST EVALUATION -->
  <rect class="panel" x="14" y="366" width="612" height="174"/>
  <rect class="badge" x="26" y="378" width="232" height="28"/>
  <text class="badge-txt" x="142" y="397" text-anchor="middle">Test Evaluation (Frozen Policy)</text>

  <rect class="box" x="26" y="426" width="166" height="78"/>
  <text class="t" x="109" y="457">Input Signals</text>
  <text class="s" x="109" y="477">Diagnosis, Context,</text>
  <text class="s" x="109" y="492">p<tspan baseline-shift="super" font-size="9">T</tspan>, p<tspan baseline-shift="super" font-size="9">V</tspan></text>

  <path class="solid" d="M 192 465 L 234 465"/>

  <rect class="box-hl" x="236" y="426" width="172" height="78"/>
  <text class="t" x="322" y="457">Frozen Policy</text>
  <text class="s" x="322" y="478">Greedy Selection</text>
  <text class="s" x="322" y="493">(Masking, No Update)</text>

  <path class="solid" d="M 408 465 L 446 465"/>

  <rect class="box" x="448" y="426" width="166" height="78"/>
  <text class="t" x="531" y="457">Prediction &amp; F1</text>
  <text class="s" x="531" y="478">No Exploration /</text>
  <text class="s" x="531" y="493">Zero Label Leakage</text>
</svg>
